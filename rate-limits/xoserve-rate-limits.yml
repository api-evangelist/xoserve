    limit: 18000000
    timeFrame: year
notes: >-
  Gas Enquiry Service APIs (Supplier, Meter Asset v1/v2) publish no allowance bands — their charging
  sits in the REC Charging Statement administered by RECCo. Since consumption is reconciled
  commercially rather than signalled in the response, an agent cannot detect approaching exhaustion
  from the API itself; budget against the contracted band out of band.
