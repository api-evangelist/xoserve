versioning:
  scheme: uri-path-segment
  mechanism: >-
    Azure API Management version sets with versioningScheme "Segment". The version is a path segment
    after the API name. Three version sets are in play: 60265ed9901b2cabf37091e6 (Meter Asset, v1 and
    v2), 60d0a4daa2fa833773705435 (Shipper, v1) and 60d0a54d54680db439823316 (Supplier, v1).
  current:
    shipper: v1
    supplier: v1
    meter-asset: v2
  caveat: >-
    The provider's exported OpenAPI documents declare `servers` without the version segment
    (https://discoveryapi.correla.com/meter-asset). The segment is mandatory in practice — the
    versionless path returns 404 while /meter-asset/v1 and /meter-asset/v2 return 401. Overlays in
    overlays/ correct the servers entry.
  docs: https://discoveryapiportal.correla.com/
concurrent_versions:
