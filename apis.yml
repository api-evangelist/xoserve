- aid: xoserve:xoserve-supplier-api
  name: Xoserve Supplier API
  description: >-
    Bundled by Xoserve as the Supply Point Enquiry service, part of the Gas Enquiry Service (GES). Exposes
    detailed supply meter point information, filtered by MPRN, address_id or postcode combined with optional
    address detail. Aimed at organisations working to improve change-of-supply and data assurance processes.
    Access is arranged through the Retail Energy Code Company (RECCo), not directly with Xoserve.
