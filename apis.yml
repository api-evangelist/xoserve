name: Xoserve
kind: company
description: >-
  Xoserve Limited is the Central Data Services Provider (CDSP) for Great Britain's gas
  market — funded, governed and owned by the gas industry itself. From Solihull it operates
  the central register of every gas supply point in Britain and runs the systems the market
  clears through: UK Link, the Gemini transmission system, the Gas Enquiry Service, the
  Contact Management Service, SwitchStream and the Data Discovery Platform. It sits between
  the gas transporters, the independent gas transporters, the shippers and the retail
  suppliers under the Uniform Network Code (UNC) and the Data Services Contract (DSC), with
  further obligations under the Retail Energy Code. Britain mandated this data
  infrastructure, not a consumer data right: there is no CDR-style, consent-driven data
  portability obligation on Xoserve, and no Green Button or Consumer Data Standards
  implementation. Its API posture reflects that split exactly. Xoserve does publish a real
  developer portal — the Discovery API Platform, delivered by its service provider Correla
  at discoveryapiportal.correla.com — where four documented REST APIs (Shipper, Supplier,
  Meter Asset v1 and v2) expose meter-point-level information including proposed Formula
  Year Annual Quantity values, current supplier, network and meter asset detail. Anyone may
  browse that catalogue and export the OpenAPI documents anonymously, but nobody can call
  the gateway without being an eligible licensed GB gas industry party: every product
  requires a subscription AND approval, keys are issued only after a contract is
  countersigned, and the gateway returns 401 for everyone else. Consumer usage data is
  therefore reachable through a documented API, but only by accredited industry, never by a
  consumer or an agent acting on their behalf. On the other side, Xoserve publishes no open
  machine-readable market-data API at all — its public outputs are the free findmysupplier
  consumer lookup it operates and the Market Domain Data participant list as a spreadsheet
  download.
