apis:
- aid: xoserve:xoserve-shipper-api
  name: Xoserve Shipper API
  description: >-
    Bundled by Xoserve as the Supply Point Quantities service. Lets gas Shippers view the proposed Formula
    Year (Billing) Annual Quantity value for a meter point ahead of the late-March notification to the
    current Shipper, together with meter point and network information. A single GET operation filtered
    by MPRN, or by postcode combined with optional address detail (house_no, street, town, county, country,
    sub_building_name, dependent_street, dependent_local). Returns JSON or XML. Available to Gas Shippers
    only, after contract countersigning.
  humanURL: https://discoveryapiportal.correla.com/api-details#api=shipper&operation=getShipper_1
  baseURL: https://discoveryapi.correla.com/shipper/v1
