apis_named_but_not_verifiable:
- name: Supply Point Switching API
  note: >-
    Named on the Xoserve Gas APIs page as part of the Gas Enquiry Service and administered by
    RECCo, with documentation behind the REC Portal login
    (https://recportal.co.uk/c/portal/login?p_l_id=61546). It does not appear in the anonymous
    Discovery API Platform catalogue and no specification could be retrieved. Not listed in
    apis.yml.
- name: Address API / Switch Gas API
  note: >-
    The Discovery API Platform home page describes a Supply Point Switching Service bundling
    an "Address API" and a "Switch Gas API". Neither appears in the anonymous /developer/apis
    catalogue (which returned exactly four entries with $top=100), so both are presumed
    restricted to subscribed groups. Not listed in apis.yml.

harvest:
  openapi_harvested: true
  specs_count: 4
  source_pattern: >-
    Azure API Management developer-portal export. GET
    https://discoveryapiportal.correla.com/developer/apis/{apiId}?api-version=2022-04-01-preview&export=true&format=openapi-link
    returns a short-lived Azure Blob SAS link to the provider's own generated OpenAPI YAML.
    Portal management endpoint declared publicly at
    https://discoveryapiportal.correla.com/config.json (managementApiUrl service name
    "xoapi-prod", managementApiVersion 2022-04-01-preview).
  caveat: >-
    IMPORTANT — the exported documents are saved verbatim and each carries `paths: {}`. That
    is not a harvest failure and not an omission on our part: Azure API Management strips
    operation detail from the export for unauthenticated callers. The operations themselves
    are real and were retrieved separately from the same portal
    (/developer/apis/{apiId}/operations and /operations/{operationId}); their methods, URL
    templates, query parameters and response examples are recorded under apis_confirmed above
    rather than being written into the specs, so that nothing is invented inside a
    provider-published artifact.
  files:
  - path: openapi/xoserve-shipper-api-openapi.yml
    source: https://discoveryapiportal.correla.com/developer/apis/shipper?api-version=2022-04-01-preview&export=true&format=openapi-link
    fetched: '2026-07-27'
    http_status: 200
    parses: true
  - path: openapi/xoserve-supplier-api-openapi.yml
    source: https://discoveryapiportal.correla.com/developer/apis/supplier?api-version=2022-04-01-preview&export=true&format=openapi-link
    fetched: '2026-07-27'
    http_status: 200
    parses: true
  - path: openapi/xoserve-meter-asset-api-v1-openapi.yml
    source: https://discoveryapiportal.correla.com/developer/apis/meter-asset?api-version=2022-04-01-preview&export=true&format=openapi-link
    fetched: '2026-07-27'
    http_status: 200
    parses: true
  - path: openapi/xoserve-meter-asset-api-v2-openapi.yml
    source: https://discoveryapiportal.correla.com/developer/apis/meter-asset-v2?api-version=2022-04-01-preview&export=true&format=openapi-link
    fetched: '2026-07-27'
    http_status: 200
    parses: true

