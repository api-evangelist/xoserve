key_model:
  issuer: Xoserve (via Correla-operated Azure API Management)
  scope: >-
    One key per subscription. The provider's subscription guide states the APIKey "is associated with
    each created subscription and cannot be utilized for any other subscriptions." An Application
    Secret is displayed alongside the key but is explicitly not required.
  scopes: none — the API declares no OAuth scopes and no per-operation permission model
  rotation: not documented
