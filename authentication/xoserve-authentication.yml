  subscription_required: true
  approval_required: true
  routes:
  - product: Supply Point Quantities (Shipper API)
    eligibility: Licensed GB gas Shippers only
    apply_to: xoserve.customer.lifecycle.team@xoserve.co.uk
    issuance: Access details provided after the subscription contract is countersigned.
  - product: Supply Point Enquiry (Supplier API)
    eligibility: REC parties, subject to the REC Data Access Matrix
    apply_to: enquiries@recmanager.co.uk (Retail Energy Code Company)
    administration: REC Portal (https://recportal.co.uk/), including an annual GES password reset process
  - product: Meter Asset Enquiry (Meter Asset v1/v2)
    eligibility: REC parties, subject to the REC Data Access Matrix
    apply_to: enquiries@recmanager.co.uk (Retail Energy Code Company)
    administration: REC Portal (https://recportal.co.uk/)
  trial:
    name: Try Before You Buy
    login: SAP S-User ID issued by Xoserve
    detail: sandbox/xoserve-sandbox.yml
notes: >-
  Browsing is open, calling is not: the portal catalogue, product descriptions and OpenAPI exports are
  all reachable anonymously, but there is no self-serve signup that ends in a working key. Because a
  key is long-lived, unscoped and carries no expiry signal, it must never be handed to a model or
  embedded client-side — see agentic-access/xoserve-agentic-access.yml.
