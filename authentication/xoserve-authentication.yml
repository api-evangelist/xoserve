description: >-
  A single auth model across the whole estate: an Azure API Management subscription key, passed either
  as the `APIKey` request header or as a `subscription-key` query parameter, over HTTPS only. There is
  no OAuth 2.0, no OpenID Connect, no mTLS and no consumer-consent grant of any kind — the portal
  reports empty oAuth2AuthenticationSettings and empty openidAuthenticationSettings for all four APIs,
  and /.well-known/openid-configuration returns 404 on every host. Prefer the header form so the
  secret does not leak into logs, referrers or browser history.
