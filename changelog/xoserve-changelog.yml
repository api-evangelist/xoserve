description: >-
  Xoserve publishes no API-level changelog — there is no per-endpoint release note, no dated entry
  list for the four gas APIs, and no changelog page on the Discovery API Platform portal. What it does
  publish is the UK Link release programme: a dated schedule of major releases against the central
  systems the APIs read from, split into "Major releases — significant changes to functionality" and
  "Minor releases — smaller enhancements", with ad-hoc changes delivered outside both on DSC customer
  request. Changes are governed through the Change Management Committee and tracked in the customer
  change register. This is the closest thing to a changelog that exists, captured verbatim.
