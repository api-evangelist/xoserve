notes: >-
  The gateway does advertise its auth scheme in a standards-based way at the HTTP layer rather than
  via /.well-known/ — an unauthenticated call returns
  `WWW-Authenticate: AzureApiManagementKey realm="https://discoveryapi.correla.com/<api>",name="APIKey",type="header"`
  alongside HTTP 401. That challenge header is captured in conventions/xoserve-conventions.yml and
